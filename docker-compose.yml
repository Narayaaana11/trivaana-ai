services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: trivaana
      POSTGRES_USER: trivaana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trivaana_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/postgres_pgvector_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivaana"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8001"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-trivaana-dev-compose-jwt-secret-change-me-32chars}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-trivaana-dev-compose-vault-key-change-me}
      DATABASE_URL: postgresql://trivaana:${POSTGRES_PASSWORD:-trivaana_dev_password}@postgres:5432/trivaana
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-trivaana-dev-compose-jwt-secret-change-me-32chars}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-trivaana-dev-compose-vault-key-change-me}
      DATABASE_URL: postgresql://trivaana:${POSTGRES_PASSWORD:-trivaana_dev_password}@postgres:5432/trivaana
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  voice-engine:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: voice-engine/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-trivaana-dev-compose-jwt-secret-change-me-32chars}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-trivaana-dev-compose-vault-key-change-me}
      DATABASE_URL: postgresql://trivaana:${POSTGRES_PASSWORD:-trivaana_dev_password}@postgres:5432/trivaana
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
